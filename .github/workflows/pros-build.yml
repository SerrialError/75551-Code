name: PROS Build (via Nix flake)

on:
  push:
    branches: "**"
  pull_request:
    branches: "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix (via cachix/install-nix-action)
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          # ensure flakes + nix-command are enabled (action enables them by default,
          # but this makes it explicit)
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Optional: pre-build the devShell so the workflow shows a clear failure
      - name: Pre-build devShell (optional, fails early if shell won't build)
        run: nix build --no-link .#devShells.x86_64-linux.default

      - name: Run PROS make inside flake devShell
        run: |
          # run the pros build inside your flake's devShell
          nix develop .#devShells.x86_64-linux.default --command "pros make -- -j"
        working-directory: ${{ github.workspace }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pros-template
          path: ${{ github.workspace }}/template/*
